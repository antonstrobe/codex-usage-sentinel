name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build local executable for checks
        shell: powershell
        run: .\build.ps1
      - name: Run offline tests
        shell: powershell
        run: .\test.ps1
      - name: Test shared bot relay
        run: python -B -m unittest discover -s relay -v
      - name: Verify release files
        shell: powershell
        run: .\verify-release.ps1
      - name: Scan release files with Windows Defender
        shell: powershell
        run: |
          $status = Get-MpComputerStatus
          $status | Select-Object AMRunningMode, AMServiceEnabled, AntivirusEnabled
          if (-not $status.AntivirusEnabled) { throw 'Windows Defender is unavailable on this runner.' }
          Start-MpScan -ScanType CustomScan -ScanPath (Join-Path $PWD 'dist')
          $threats = @(Get-MpThreatDetection | Where-Object { ($_.Resources -join ' ') -like ('*' + $PWD.Path + '*') })
          if ($threats.Count -gt 0) { throw 'Defender detected a threat in release files.' }
