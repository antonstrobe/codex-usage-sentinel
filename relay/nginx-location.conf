# Include only in the chosen virtual host. All API requests must use HTTPS.
location = /codex-usage { return 404; }
location ^~ /codex-usage/ {
    if ($scheme != https) { return 404; }
    limit_req zone=codex_usage_requests burst=20 nodelay;
    limit_req_status 429;
    limit_conn codex_usage_connections 10;
    limit_conn_status 429;
    proxy_pass http://127.0.0.1:8796/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Authorization $http_authorization;
    proxy_connect_timeout 3s;
    proxy_read_timeout 25s;
    client_max_body_size 16k;
    access_log off;
    error_log /var/log/nginx/codex-usage-relay-error.log crit;
}
